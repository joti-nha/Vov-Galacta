<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t">
  <title id="t">Panela-planeta da Vó Galacta com utensílios em órbita</title>
  <defs>
    <radialGradient id="corpo" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f6c978"/>
      <stop offset="0.55" stop-color="#f0b85a"/>
      <stop offset="1" stop-color="#9a6a24"/>
    </radialGradient>
    <linearGradient id="borda" x1="0" x2="1">
      <stop offset="0" stop-color="#c78f3a"/>
      <stop offset="0.5" stop-color="#f6c978"/>
      <stop offset="1" stop-color="#a87530"/>
    </linearGradient>
    <radialGradient id="brilho" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0b85a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0b85a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caldo" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#63d6e8"/>
      <stop offset="1" stop-color="#2b8fa3"/>
    </linearGradient>
  </defs>

  <!-- estrelas -->
  <g fill="#e9eff3">
    <circle cx="60" cy="70" r="2"/><circle cx="500" cy="60" r="1.6"/><circle cx="470" cy="420" r="2"/>
    <circle cx="90" cy="400" r="1.5"/><circle cx="35" cy="250" r="1.2"/><circle cx="525" cy="250" r="1.4"/>
    <circle cx="160" cy="30" r="1.2"/><circle cx="400" cy="490" r="1.3"/>
  </g>
  <g fill="#f0b85a">
    <path d="M120 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M455 150 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
  </g>

  <!-- brilho atrás da panela -->
  <circle cx="280" cy="300" r="220" fill="url(#brilho)"/>

  <!-- vapor subindo e virando estrelas -->
  <g fill="none" stroke="#e9eff3" stroke-linecap="round" stroke-width="7" opacity="0.85">
    <path d="M240 190 c-22 -26 22 -42 0 -70 c-16 -20 6 -38 14 -48"/>
    <path d="M285 182 c-20 -30 26 -48 2 -82 c-14 -20 4 -40 12 -52"/>
    <path d="M330 190 c-22 -26 22 -42 0 -70 c-14 -18 4 -34 10 -42"/>
  </g>
  <g fill="#e9eff3">
    <path d="M254 58 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M299 34 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M340 66 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
  </g>

  <!-- órbita (metade de trás) -->
  <ellipse cx="280" cy="318" rx="250" ry="70" fill="none" stroke="#63d6e8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" transform="rotate(-12 280 318)" opacity="0.8"/>

  <!-- alças -->
  <path d="M118 262 h-34 a18 18 0 0 0 0 36 h34" fill="none" stroke="#9a6a24" stroke-width="16" stroke-linecap="round"/>
  <path d="M442 262 h34 a18 18 0 0 1 0 36 h-34" fill="none" stroke="#9a6a24" stroke-width="16" stroke-linecap="round"/>

  <!-- corpo da panela: um planeta com faixas -->
  <path d="M110 230 h340 v40 a170 170 0 0 1 -340 0 z" fill="url(#corpo)"/>
  <g fill="none" stroke="#9a6a24" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M128 320 q152 40 304 0"/>
    <path d="M160 378 q120 30 240 0"/>
  </g>
  <circle cx="200" cy="300" r="16" fill="#f6c978" opacity="0.7"/>
  <circle cx="370" cy="350" r="10" fill="#9a6a24" opacity="0.5"/>

  <!-- boca da panela e o caldo -->
  <ellipse cx="280" cy="230" rx="170" ry="30" fill="url(#borda)"/>
  <ellipse cx="280" cy="232" rx="152" ry="21" fill="url(#caldo)"/>
  <g fill="#e9eff3" opacity="0.8">
    <circle cx="232" cy="230" r="6"/><circle cx="300" cy="236" r="4"/><circle cx="335" cy="228" r="5"/>
  </g>

  <!-- órbita (metade da frente) com a concha e a colher -->
  <path d="M38 360 Q 280 470 522 280" fill="none" stroke="#63d6e8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.9"/>

  <g transform="translate(92 402) rotate(-28)">
    <rect x="0" y="-6" width="96" height="12" rx="6" fill="#e9eff3"/>
    <path d="M96 -26 a26 26 0 1 1 0 52 a26 26 0 0 1 0 -52z" fill="#e9eff3"/>
    <path d="M100 -14 a14 14 0 0 1 0 28" fill="none" stroke="#9db2c1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(438 318) rotate(-62)">
    <rect x="0" y="-5" width="80" height="10" rx="5" fill="#63d6e8"/>
    <ellipse cx="96" cy="0" rx="22" ry="15" fill="#63d6e8"/>
  </g>

  <!-- batedor em órbita, ao fundo -->
  <g transform="translate(470 196) rotate(28)" opacity="0.9">
    <rect x="-4" y="0" width="8" height="40" rx="4" fill="#9db2c1"/>
    <path d="M0 40 c-22 10 -22 54 0 60 c22 -6 22 -50 0 -60z M0 40 c-9 12 -9 48 0 60 c9 -12 9 -48 0 -60z" fill="none" stroke="#9db2c1" stroke-width="4"/>
  </g>
</svg>
